<style>
  :root{
    --bg:#f4f9fc; --card:#ffffff; --ink:#0d1a24; --muted:#54697c;

    --ok:#0f9d77; --warn:#c9700a;

  @media (prefers-color-scheme: dark){
    :root{ --bg:#081521; --card:#0f2130; --ink:#e8f3fb; --muted:#93aec2; --line:#1d3446; }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 80px}
  header.hero{background:linear-gradient(135deg,#0a1826,#0b2b3f);color:#fff;padding:38px 0 30px;
       border-bottom:3px solid var(--brand)}
  .hero .wrap{display:flex;align-items:center;gap:18px;padding-bottom:0}
  .logo{flex:0 0 auto;width:60px;height:60px}
  .hero h1{margin:0;font-size:1.7rem;letter-spacing:.2px}
  .hero p{margin:4px 0 0;color:#a9c6da;font-size:.95rem}
  .langbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
       padding:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .langbar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:0;align-items:center}
  .langbar .lbl{font-size:.82rem;color:var(--muted);margin-right:4px}
  .lang{border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;
       padding:6px 12px;border-radius:999px;font-size:.85rem;transition:.15s}
  .lang:hover{border-color:var(--brand)}
  .lang[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .updated{color:var(--muted);font-size:.9rem;margin:22px 0 6px}
  .summary{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(59,130,246,.10));
       border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;
       padding:16px 18px;margin:14px 0 8px}
  .summary b{color:var(--brand)}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:18px 20px;margin:16px 0;box-shadow:0 1px 3px rgba(13,26,36,.04)}
  section.card h2{margin:.1em 0 .5em;font-size:1.12rem;color:var(--ink)}
  section.card h2 .n{color:var(--brand);font-weight:700;margin-right:.45em}
  ul{margin:.4em 0;padding-left:1.2em}
  li{margin:.32em 0}
  .pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;
       background:rgba(15,157,119,.14);color:var(--ok);margin-left:6px;vertical-align:middle}
  .pill.warn{background:rgba(201,112,10,.14);color:var(--warn)}
  a{color:var(--brand)}
  code{background:rgba(34,211,238,.12);padding:1px 6px;border-radius:5px;font-size:.92em}
  footer{color:var(--muted);font-size:.85rem;text-align:center;margin-top:30px}
</style>

es:{ name:"Español", dir:"ltr",
  title:"Política de privacidad de Caudal",
  tag:"Un reproductor. Lo mínimo sale de tu dispositivo.",
  updated:"Última actualización: 30 de septiembre de 2026",
  langlabel:"Idioma:",
  summary:"<b>En resumen:</b> Caudal es un reproductor multimedia. Tú aportas tus listas y Caudal las reproduce. Tus listas y credenciales se guardan <b>cifradas en tu dispositivo</b>. Salen <b>métricas de uso anónimas</b> y un <b>diagnóstico técnico</b> de los fallos (los dos vienen activados y puedes apagarlos en Ajustes); la sincronización, solo si TÚ la activas. <b>Sin anuncios y sin rastreadores de terceros</b>, y sin venta de datos.",
  sections:[
    {h:"Quiénes somos", html:"Caudal es un reproductor multimedia para Android y Android TV, desarrollado de forma independiente. No aloja ni proporciona canales o contenidos: tú aportas tus fuentes. Para cualquier consulta sobre privacidad escribe a "+mail+"."},
    {h:"Lo que se queda en tu dispositivo", html:"Tus listas (M3U/Xtream), credenciales, favoritos, historial de «continuar viendo», perfiles y ajustes se guardan <b>cifrados en tu propio dispositivo</b>. No se envían a Caudal salvo en los casos opcionales de abajo. "+OK("local")+""},
    {h:"Métricas de uso anónimas (ACTIVADAS, puedes apagarlas)", html:"Para saber si la app se usa y qué merece la pena mejorar, se cuentan de forma anónima cosas como cuántas veces se abre, si has llegado a conectar una lista, si has reproducido algo y qué funciones usas. Se usa un <b>identificador aleatorio de instalación</b> (no el de publicidad), las cantidades viajan <b>por tramos</b> y no exactas, y hay una <b>lista cerrada</b> de lo que se puede enviar: no caben nombres de canal, URLs ni credenciales. No se guarda tu IP ni evento alguno por separado, solo contadores agregados. Apágalo cuando quieras en Ajustes. "+OK("puedes apagarlo")+""},
    {h:"Diagnóstico de reproducción (ACTIVADO, puedes apagarlo)", html:"Viene activado para ayudarnos a corregir fallos, y la app te lo avisa al empezar. Se envían señales técnicas: un <b>identificador de instalación anónimo</b>, el modelo y la versión de tu dispositivo, la versión de la app, eventos de reproducción (nombre de canal saneado, estado, cortes y errores) y, si la app se cierra de golpe, el informe técnico del fallo. <b>Nunca</b> se envían tus credenciales ni las URLs de tus listas. Retención: 48 horas. Apágalo cuando quieras en Ajustes. "+OK("puedes apagarlo")+""},
    {h:"Sincronización y «enviar a la TV» (opcional, Premium)", html:"Si vinculas tus dispositivos con un código, tus datos viajan <b>cifrados de extremo a extremo</b>: nuestro servidor solo guarda texto cifrado que <b>no puede leer</b>, identificado por ese código. Sirve para sincronizar favoritos e historial y enviar un canal a tu tele. Puedes desvincular cuando quieras. "+WARN("opcional")+""},
    {h:"Suscripción Premium", html:"El pago y la comprobación de tu compra los hace <b>Google Play</b> directamente en tu dispositivo: Caudal no envía el comprobante a ningún servidor propio y <b>no recibe los datos de tu tarjeta</b>. Puedes cancelar la suscripción cuando quieras en Google Play › Suscripciones."},
    {h:"Lo que NO hacemos", html:"<ul><li>No mostramos anuncios de terceros ni incluimos SDK de publicidad.</li><li>No usamos analítica ni rastreadores de terceros.</li><li>No vendemos tus datos ni creamos perfiles publicitarios.</li><li>No accedemos a tus contactos, ubicación, fotos ni micrófono.</li></ul>"},
    {h:"Permisos", html:"Caudal usa <b>Internet</b> para reproducir tus fuentes y, en el canal de instalación directa (fuera de Google Play), <b>instalar sus propias actualizaciones</b>. No pide permisos sensibles."},
    {h:"Menores", html:"Caudal no está dirigido a menores de edad."},
    {h:"Tus derechos y el borrado de datos (RGPD)", html:"Al desinstalar la app se eliminan todos los datos locales. Para los datos del servidor: desvincular la sincronización restablece tu grupo cifrado; el diagnóstico caduca solo a las 48 h; y puedes escribirnos para eliminar cualquier dato asociado a tu identificador de instalación o a tu compra: "+mail+"."},
    {h:"Seguridad", html:"El almacenamiento local va cifrado. Las conexiones a nuestros servidores usan HTTPS. La app comprueba su propia firma para detectar copias manipuladas."},
    {h:"Cambios en esta política", html:"Si modificamos esta política, actualizaremos esta página y su fecha."},
    {h:"Contacto", html:"Para cualquier duda sobre privacidad: "+mail+"."}
  ],
  footer:"Caudal — Reproductor multimedia neutro. Esta página es informativa y no constituye asesoramiento legal. Caudal no proporciona, aloja ni distribuye canales ni contenidos."

en:{ name:"English", dir:"ltr",
  title:"Caudal Privacy Policy",
  tag:"Just a player. The minimum leaves your device.",
  updated:"Last updated: 30 September 2026",
  langlabel:"Language:",
  summary:"<b>In short:</b> Caudal is a media player. You bring your lists and Caudal plays them. Your lists and credentials are stored <b>encrypted on your device</b>. <b>Anonymous usage metrics</b> and <b>technical diagnostics</b> about failures are sent (both are on by default and you can switch them off in Settings); sync only if YOU turn it on. <b>No ads, no third-party trackers</b>, no data selling.",
  sections:[
    {h:"Who we are", html:"Caudal is an independently developed media player for Android and Android TV. It does not host or provide any channels or content: you bring your own sources. For any privacy question, write to "+mail+"."},
    {h:"What stays on your device", html:"Your lists (M3U/Xtream), credentials, favourites, \"continue watching\" history, profiles and settings are stored <b>encrypted on your own device</b>. They are not sent to Caudal except in the optional cases below. "+OK("local")+""},
    {h:"Anonymous usage metrics (ON, you can switch them off)", html:"To know whether the app is actually used and what is worth improving, we anonymously count things like how often it is opened, whether you managed to connect a playlist, whether you played anything and which features you use. It uses a <b>random install identifier</b> (not the advertising ID), amounts travel <b>in bands</b> rather than exact values, and there is a <b>closed list</b> of what can be sent: channel names, URLs and credentials do not fit in it. Your IP is not stored and neither is any individual event, only aggregate counters. Switch it off anytime in Settings. "+OK("you can switch it off")+""},
    {h:"Playback diagnostics (ON, you can switch it off)", html:"It is on by default to help us fix problems, and the app tells you so when you start. It sends technical signals: an <b>anonymous install identifier</b>, your device model and version, the app version, playback events (sanitised channel name, state, drops and errors) and, if the app crashes, the technical crash report. Your credentials and list URLs are <b>never</b> sent. Retention: 48 hours. Switch it off at any time in Settings. "+OK("you can switch it off")+""},
    {h:"Sync and \"send to TV\" (optional, Premium)", html:"If you link your devices with a code, your data travels <b>end-to-end encrypted</b>: our server only stores ciphertext it <b>cannot read</b>, identified by that code. It syncs favourites and history and sends a channel to your TV. You can unlink anytime. "+WARN("optional")+""},
    {h:"Premium subscription", html:"Payment and purchase verification are handled by <b>Google Play</b> directly on your device: Caudal does not send your receipt to any server of its own and <b>never receives your card details</b>. You can cancel the subscription at any time in Google Play › Subscriptions."},
    {h:"What we do NOT do", html:"<ul><li>No third-party ads and no ad SDKs.</li><li>No third-party analytics or trackers.</li><li>We don't sell your data or build advertising profiles.</li><li>We don't access your contacts, location, photos or microphone.</li></ul>"},
    {h:"Permissions", html:"Caudal uses the <b>Internet</b> to play your sources and, on the direct-install channel (outside Google Play), to <b>install its own updates</b>. It requests no sensitive permissions."},
    {h:"Children", html:"Caudal is not directed at children."},
    {h:"Your rights and data deletion (GDPR)", html:"Uninstalling the app removes all local data. For server data: unlinking sync resets your encrypted group; diagnostics expire on their own after 48h; and you can write to us to delete any data tied to your install identifier or your purchase: "+mail+"."},
    {h:"Security", html:"Local storage is encrypted. Connections to our servers use HTTPS. The app checks its own signature to detect tampered copies."},
    {h:"Changes to this policy", html:"If we change this policy, we will update this page and its date."},
    {h:"Contact", html:"For any privacy question: "+mail+"."}
  ],
  footer:"Caudal — Neutral media player. This page is informational and not legal advice. Caudal does not provide, host or distribute any channels or content."
},

    {h:"Ce qui reste sur votre appareil", html:"Vos listes (M3U/Xtream), identifiants, favoris, historique « reprendre la lecture », profils et réglages sont stockés <b>chiffrés sur votre propre appareil</b>. Ils ne sont pas envoyés à Caudal sauf dans les cas facultatifs ci-dessous. "+OK("local")+""},
    {h:"Statistiques d'usage anonymes (ACTIVÉES, désactivables)", html:"Pour savoir si l'application est réellement utilisée et ce qu'il vaut la peine d'améliorer, on compte de façon anonyme le nombre d'ouvertures, si vous avez réussi à connecter une liste, si vous avez lu quelque chose et quelles fonctions vous utilisez. On utilise un <b>identifiant d'installation aléatoire</b> (pas l'identifiant publicitaire), les quantités circulent <b>par tranches</b> et non exactes, et une <b>liste fermée</b> définit ce qui peut être envoyé : ni noms de chaîne, ni URL, ni identifiants. Votre IP n'est pas conservée, aucun événement individuel non plus, seulement des compteurs agrégés. Désactivable à tout moment dans les réglages. "+OK("désactivable")+""},
    {h:"Diagnostic de lecture (ACTIVÉ, désactivable)", html:"Il est activé par défaut pour nous aider à corriger les problèmes, et l'appli vous le signale au démarrage. Des signaux techniques sont envoyés : un <b>identifiant d'installation anonyme</b>, le modèle et la version de votre appareil, la version de l'appli, des événements de lecture (nom de chaîne assaini, état, coupures et erreurs) et, si l'appli se ferme brutalement, le rapport technique de la panne. Vos identifiants et les URL de vos listes ne sont <b>jamais</b> envoyés. Conservation : 48 heures. Désactivez-le quand vous voulez dans les réglages. "+OK("désactivable")+""},
    {h:"Synchronisation et « envoyer vers la TV » (facultatif, Premium)", html:"Si vous liez vos appareils avec un code, vos données transitent <b>chiffrées de bout en bout</b> : notre serveur ne stocke qu'un texte chiffré qu'il <b>ne peut pas lire</b>, identifié par ce code. Cela synchronise favoris et historique et envoie une chaîne vers votre télé. Vous pouvez dissocier à tout moment. "+WARN("facultatif")+""},
    {h:"Abonnement Premium", html:"Le paiement et la vérification de votre achat sont assurés par <b>Google Play</b> directement sur votre appareil : Caudal n'envoie le reçu à aucun serveur à lui et <b>ne reçoit pas vos données bancaires</b>. Vous pouvez résilier l'abonnement à tout moment dans Google Play › Abonnements."},
    {h:"Ce que nous ne faisons PAS", html:"<ul><li>Aucune publicité tierce ni SDK publicitaire.</li><li>Aucune analytique ni traceur tiers.</li><li>Nous ne vendons pas vos données et ne créons pas de profils publicitaires.</li><li>Nous n'accédons ni à vos contacts, ni à votre position, ni à vos photos, ni au micro.</li></ul>"},
    {h:"Autorisations", html:"Caudal utilise <b>Internet</b> pour lire vos sources et, sur le canal d'installation directe (hors Google Play), pour <b>installer ses propres mises à jour</b>. Il ne demande aucune autorisation sensible."},

    {h:"Vos droits et l'effacement (RGPD)", html:"Désinstaller l'appli supprime toutes les données locales. Pour les données du serveur : dissocier la synchro réinitialise votre groupe chiffré ; le diagnostic expire seul après 48 h ; et vous pouvez nous écrire pour effacer toute donnée liée à votre identifiant d'installation ou à votre achat : "+mail+"."},
    {h:"Sécurité", html:"Le stockage local est chiffré. Les connexions à nos serveurs utilisent HTTPS. L'appli vérifie sa propre signature pour détecter les copies altérées."},
    {h:"Modifications", html:"Si nous modifions cette politique, nous mettrons à jour cette page et sa date."},
    {h:"Contact", html:"Pour toute question sur la confidentialité : "+mail+"."}
  ],
  footer:"Caudal — Lecteur multimédia neutre. Cette page est informative et ne constitue pas un conseil juridique. Caudal ne fournit, n'héberge ni ne distribue aucune chaîne ou contenu."
},

const ORDER = ["es","en","fr","pt","ru","zh","ar"];

function render(lang){
  const d = T[lang] || T.es;
  document.documentElement.lang = lang;
  document.documentElement.dir = d.dir || "ltr";
  document.getElementById("t-title").textContent = d.title;
  document.getElementById("t-tag").textContent = d.tag;
  document.getElementById("t-langlabel").textContent = d.langlabel;
  document.getElementById("t-updated").innerHTML = "<em>"+d.updated+"</em>";
  document.getElementById("t-summary").innerHTML = d.summary;
  document.getElementById("content").innerHTML = d.sections.map(function(s,i){
    return '<section class="card"><h2><span class="n">'+(i+1)+'.</span>'+s.h+'</h2>'+s.html+'</section>';
  }).join("");
  document.getElementById("t-footer").innerHTML = d.footer;
  document.title = d.title;
  Array.prototype.forEach.call(document.querySelectorAll(".lang"), function(b){
    b.setAttribute("aria-pressed", b.dataset.l === lang ? "true":"false");
  });
  try{ history.replaceState(null,"","#"+lang); }catch(e){}
}
(function init(){
  document.getElementById("langbtns").innerHTML = ORDER.map(function(l){
    return '<button class="lang" data-l="'+l+'" type="button">'+T[l].name+'</button>';
  }).join(" ");
  Array.prototype.forEach.call(document.querySelectorAll(".lang"), function(b){
    b.addEventListener("click", function(){ render(b.dataset.l); });
  });
  const hash = (location.hash||"").replace("#","");
  const nav = (navigator.language||"es").slice(0,2).toLowerCase();
  render(T[hash] ? hash : (T[nav] ? nav : "es"));
})();
</script>
